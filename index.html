<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="styles/index.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script defer src="scripts/index.js"></script>
  <title>Frontend Mentor | Interactive rating component</title>
</head>
<body>
  <article id="CampoDeFeedback">
    <img src="images/icon-star.svg" class="icone-estrela">

    <h1>How did we do?</h1>

    <p> Please let us now how we did with your support request.All feedback is appreciated to help us improve our offering!</p>
    
    <form id="FeedbackFormulario">
      <input type="radio" id="feedback1" name="feedback" value="1">
      <label for="feedback1">1</label>
      <input type="radio" id="feedback2" name="feedback" value="2">
      <label for="feedback2">2</label>
      <input type="radio" id="feedback3" name="feedback" value="3">
      <label for="feedback3">3</label>
      <input type="radio" id="feedback4" name="feedback" value="4">
      <label for="feedback4">4</label>
      <input type="radio" id="feedback5" name="feedback" value="5">
      <label for="feedback5">5</label>
    </form>

    <button id="Submit" class="Submit">SUBMIT</button>
  </article>

  <article id="CampoDeResultado">
    <img class="CelularResultado" src="images/illustration-thank-you.svg" alt="ilustracao de um celular">

    <p class ="FeedbackResultado">You selected 0 out of 5</p>

    <h2 class="TituloResultado">Thank you!</h2>

    <p class="MensagemResultado">We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
  </article>



</body>
</html>
